name: Build obs-ffmpeg-afilter for Fedora Linux 44

# 在 fedora:44 容器里从上游 sorayuki/obs-ffmpeg-afilter 直接拉最新源码编译。
# 不依赖本仓库 plugins/obs-ffmpeg-afilter/ 的内容（但保留作为快照 + 汉化源）。
#
# 设计要点：
# - 每次 Run workflow 都 git clone 上游 master 最新 commit（用 --depth 1 加快速度）
# - 上游 sorayuki/obs-ffmpeg-afilter 没汉化（data/locale/ 只有空的 en-US.ini），
#   用户在本仓库手工写了 37 KB 的 zh-CN.ini（34 个滤镜名 + 199 个参数 tooltip 等），
#   编译前从本仓库 plugins/obs-ffmpeg-afilter/data/locale/zh-CN.ini 覆盖上去，
#   确保汉化不丢
# - cmake 用上游 linux-x86_64 preset（generator: Ninja, binaryDir: build_x86_64）
# - Fedora ffmpeg-devel 把头文件装在 /usr/include/ffmpeg/libav*/，
#   上游 CMakeLists 用 find_path 找不到；用 symlink 把头文件链到 /usr/include/
# - cmake install 后产物在 <prefix>/obs/obs-plugins/obs-ffmpeg-afilter/，
#   data/locale/ 也在里面；直接从该子目录拷到 stage
# - 末尾的 ABI 校验确认 libobs.so.30 / libavutil.so.60 / libavfilter.so.11 等
#   全部命中本机 Fedora 44 系统的 /lib64/

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Fedora 44 container
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: 安装 git（fedora:44 镜像默认没装）
        run: dnf install -y --setopt=install_weak_deps=False git

      - name: 拉取本仓库（拿到 plugins/obs-ffmpeg-afilter/data/locale/zh-CN.ini 汉化备份）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 拉取上游源码到容器内
        run: |
          set -euxo pipefail
          rm -rf /tmp/upstream /tmp/build
          git clone --depth 1 https://github.com/sorayuki/obs-ffmpeg-afilter.git /tmp/upstream
          echo "=== 上游 HEAD ==="
          git -C /tmp/upstream log -1 --oneline
          mkdir -p /tmp/build/plugins
          cp -r /tmp/upstream /tmp/build/plugins/obs-ffmpeg-afilter

      - name: 覆盖 data/locale/zh-CN.ini（保留本仓库用户手工汉化）
        run: |
          set -euxo pipefail
          LOCAL_ZHCN="$GITHUB_WORKSPACE/plugins/obs-ffmpeg-afilter/data/locale/zh-CN.ini"
          BUILD_ZHCN_DIR="/tmp/build/plugins/obs-ffmpeg-afilter/data/locale"
          test -f "$LOCAL_ZHCN" || { echo "❌ 本仓库没有 $LOCAL_ZHCN"; exit 1; }
          mkdir -p "$BUILD_ZHCN_DIR"
          cp -v "$LOCAL_ZHCN" "$BUILD_ZHCN_DIR/zh-CN.ini"
          echo "=== 汉化备份大小 ==="
          wc -c "$LOCAL_ZHCN" "$BUILD_ZHCN_DIR/zh-CN.ini"

      - name: 启用 RPM Fusion Free 并安装构建依赖
        run: |
          set -euxo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm"

          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ ninja-build pkg-config \
            obs-studio-devel ffmpeg-devel

          test -f /usr/include/obs/obs.h || { echo "❌ 缺 obs.h"; exit 1; }
          test -f /usr/include/ffmpeg/libavfilter/avfilter.h || { echo "❌ 缺 avfilter.h"; exit 1; }
          test -f /usr/include/ffmpeg/libavutil/avutil.h || { echo "❌ 缺 avutil.h"; exit 1; }
          test -f /usr/include/ffmpeg/libavformat/avformat.h || { echo "❌ 缺 avformat.h"; exit 1; }

          echo "=== 装上的关键包 ==="
          rpm -q obs-studio-devel ffmpeg-devel cmake gcc-c++ ninja-build

      - name: 把 ffmpeg 头文件软链到默认搜索路径
        run: |
          set -euxo pipefail
          # Fedora ffmpeg-devel 把头文件装在 /usr/include/ffmpeg/libav*/，
          # 但 plugin 的 CMakeLists.txt 用了 find_path(avformat.h PATHS include)，
          # 找不到 Fedora 布局。把头文件软链到 /usr/include/ 让默认 find_path 命中。
          for d in libavutil libavfilter libavformat libavcodec libswresample libswscale; do
            ln -sf "/usr/include/ffmpeg/$d" "/usr/include/$d"
          done
          ls -la /usr/include/libavutil/avutil.h /usr/include/libavfilter/avfilter.h

      - name: CMake configure（用上游 linux-x86_64 preset）
        working-directory: /tmp/build/plugins/obs-ffmpeg-afilter
        run: |
          set -euxo pipefail
          cmake --preset linux-x86_64 \
            -DCMAKE_INSTALL_PREFIX=/tmp/install-system

      - name: CMake build
        working-directory: /tmp/build/plugins/obs-ffmpeg-afilter
        run: cmake --build build_x86_64 --config RelWithDebInfo --parallel

      - name: CMake install
        working-directory: /tmp/build/plugins/obs-ffmpeg-afilter
        run: |
          set -euxo pipefail
          cmake --install build_x86_64 --config RelWithDebInfo --prefix /tmp/install-system
          echo
          echo "=== install 出来的目录树 ==="
          find /tmp/install-system -mindepth 1 | sort

      - name: 打包成用户级插件目录布局
        run: |
          set -euxo pipefail
          STAGE=/tmp/stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/obs-ffmpeg-afilter"

          # 找 install 出来的 obs-ffmpeg-afilter 子目录
          PLUGIN_INSTALL_DIR=$(find /tmp/install-system -path "*/obs/obs-plugins/obs-ffmpeg-afilter" -type d | head -1)
          if [ -n "$PLUGIN_INSTALL_DIR" ]; then
            cp -r "$PLUGIN_INSTALL_DIR/." "$STAGE/obs-ffmpeg-afilter/"
          else
            echo "❌ 找不到 obs-ffmpeg-afilter install 子目录"
            find /tmp/install-system -type d | sort
            exit 1
          fi

          echo "=== 打包前目录结构 ==="
          find "$STAGE" -mindepth 1 | sort

          tar -C "$STAGE" -czf "obs-ffmpeg-afilter-fedora44-x86_64.tar.gz" "obs-ffmpeg-afilter"
          ls -la "obs-ffmpeg-afilter-fedora44-x86_64.tar.gz"

      - name: 验证打包产物的 ABI（必须匹配 Fedora 44）
        run: |
          set -euxo pipefail
          VERIFY=/tmp/verify
          rm -rf "$VERIFY" && mkdir -p "$VERIFY"
          tar -xzf "obs-ffmpeg-afilter-fedora44-x86_64.tar.gz" -C "$VERIFY"
          SO=$(find "$VERIFY" -name "obs-ffmpeg-afilter.so" -type f | head -1)
          test -f "$SO" || { echo "❌ 找不到 .so"; find "$VERIFY" | sort; exit 1; }
          chmod +x "$SO"

          echo "=== DT_NEEDED ==="
          objdump -p "$SO" | grep -E "NEEDED"

          echo
          echo "=== ldd 命中检查 ==="
          ldd "$SO" 2>&1

          echo
          echo "=== 关键 soname 断言 ==="
          NEEDED=$(objdump -p "$SO" | awk '/NEEDED/ {print $2}')
          for lib in libobs.so.30 libavutil.so.60 libavfilter.so.11; do
            if echo "$NEEDED" | grep -qx "$lib"; then
              echo " ✅ $lib 在 DT_NEEDED 中"
            else
              echo " ⚠️ $lib 不在 DT_NEEDED"
            fi
          done

          if ldd "$SO" 2>&1 | grep -q "not found"; then
            echo "❌ ldd 发现未命中的库（ABI 不兼容）："
            ldd "$SO" 2>&1 | grep "not found"
            exit 1
          fi
          echo "✅ ldd 全部命中（ABI 与 Fedora 44 兼容）"
          echo
          echo "🎉 全部通过——编译产物 ABI 与 Fedora 44 匹配"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-ffmpeg-afilter-fedora44-x86_64
          path: obs-ffmpeg-afilter-fedora44-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
