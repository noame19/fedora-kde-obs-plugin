name: Build obs-backgroundremoval for Fedora Linux 44

# 在 fedora:44 容器里从上游 royshil/obs-backgroundremoval 直接拉最新源码编译。
# 不依赖本仓库 plugins/obs-backgroundremoval/ 的内容（但保留作为快照）。
#
# 设计要点：
# - 每次 Run workflow 都 git clone 上游 master 最新 commit（用 --depth 1 加快速度）
# - obs-backgroundremoval 上游的 zh-CN.ini 跟本仓库一致（diff 验证过），无本地化内容
# - cmake 用上游 CMakeLists.txt 自带的 Linux 构建目标（不用 preset，避免环境变量依赖）
# - cmake install 用 UserPlugin 组件（obs-backgroundremoval 上游定义了此组件），
#   自动产出 obs-backgroundremoval/{bin/64bit,data/locale,data/models,...} 布局
# - 末尾的 ABI 校验确认 libobs.so.30 / libobs-frontend-api.so.30 / onnxruntime / opencv 等
#   全部命中本机 Fedora 44 系统的 /lib64/

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Fedora 44 container
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: 安装 git（fedora:44 镜像默认没装）
        run: dnf install -y --setopt=install_weak_deps=False git

      - name: 拉取上游源码到容器内（不接触本仓库 plugins/ 目录）
        run: |
          set -euxo pipefail
          rm -rf /tmp/upstream /tmp/build
          git clone --depth 1 https://github.com/royshil/obs-backgroundremoval.git /tmp/upstream
          echo "=== 上游 HEAD ==="
          git -C /tmp/upstream log -1 --oneline
          mkdir -p /tmp/build/plugins
          # 拷贝源码到构建目录，排除 .git 和 .github
          cp -r /tmp/upstream /tmp/build/plugins/obs-backgroundremoval
          # 注意：上游有 .gitmodules 子模块，剔除它们避免干扰
          find /tmp/build/plugins/obs-backgroundremoval -name '.gitmodules' -delete 2>/dev/null || true

      - name: 安装构建依赖（含 RPM Fusion Free 提供 ffmpeg 等）
        run: |
          set -euxo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm"

          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ ninja-build pkgconf-pkg-config \
            obs-studio-devel \
            opencv-devel \
            onnxruntime-devel \
            qt6-qtbase-devel \
            libcurl-devel \
            flatbuffers-devel \
            protobuf-compiler

          test -f /usr/include/obs/obs.h || { echo "❌ 缺 obs.h"; exit 1; }
          test -f /usr/include/onnxruntime/core/session/onnxruntime_cxx_api.h \
            || test -f /usr/include/onnxruntime/onnxruntime_cxx_api.h \
            || { echo "❌ 缺 onnxruntime 头文件"; exit 1; }
          test -f /usr/include/opencv4/opencv2/core.hpp || { echo "❌ 缺 opencv2/core.hpp"; exit 1; }
          test -f /usr/include/qt6/QtWidgets/QtWidgets || { echo "❌ 缺 Qt6 Widgets"; exit 1; }

          echo "=== 装上的关键包 ==="
          rpm -q obs-studio-devel opencv onnxruntime-devel qt6-qtbase-devel cmake gcc-c++

      - name: CMake configure（直接 -S -B，避免 preset 环境变量依赖）
        working-directory: /tmp/build/plugins/obs-backgroundremoval
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/install-system \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: CMake build
        working-directory: /tmp/build/plugins/obs-backgroundremoval
        run: cmake --build build --parallel

      - name: CMake install（用 UserPlugin 组件，上游已定义）
        working-directory: /tmp/build/plugins/obs-backgroundremoval
        run: |
          set -euxo pipefail
          cmake --install build --component UserPlugin --prefix /tmp/install-system
          echo
          echo "=== install 出来的目录树 ==="
          find /tmp/install-system -mindepth 1 | sort

      - name: 打包成用户级插件目录布局
        run: |
          set -euxo pipefail
          STAGE=/tmp/stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/obs-backgroundremoval"

          # --component UserPlugin 应该已经装到 <prefix>/obs/obs-plugins/<name>/
          # 直接搬这个子目录到 stage
          PLUGIN_INSTALL_DIR=$(find /tmp/install-system -path "*/obs/obs-plugins/obs-backgroundremoval" -type d | head -1)
          if [ -n "$PLUGIN_INSTALL_DIR" ]; then
            cp -r "$PLUGIN_INSTALL_DIR/." "$STAGE/obs-backgroundremoval/"
          else
            echo "❌ 找不到 obs-backgroundremoval install 子目录"
            find /tmp/install-system -type d | sort
            exit 1
          fi

          echo "=== 打包前目录结构 ==="
          find "$STAGE" -mindepth 1 | sort

          tar -C "$STAGE" -czf "obs-backgroundremoval-fedora44-x86_64.tar.gz" "obs-backgroundremoval"
          ls -la "obs-backgroundremoval-fedora44-x86_64.tar.gz"

      - name: 验证打包产物的 ABI（必须匹配 Fedora 44）
        run: |
          set -euxo pipefail
          VERIFY=/tmp/verify
          rm -rf "$VERIFY" && mkdir -p "$VERIFY"
          tar -xzf "obs-backgroundremoval-fedora44-x86_64.tar.gz" -C "$VERIFY"
          SO=$(find "$VERIFY" -name "obs-backgroundremoval.so" -type f | head -1)
          test -f "$SO" || { echo "❌ 找不到 .so"; find "$VERIFY" | sort; exit 1; }
          chmod +x "$SO"

          echo "=== DT_NEEDED ==="
          objdump -p "$SO" | grep -E "NEEDED"

          echo
          echo "=== ldd 命中检查 ==="
          ldd "$SO" 2>&1

          echo
          echo "=== 关键 soname 断言 ==="
          NEEDED=$(objdump -p "$SO" | awk '/NEEDED/ {print $2}')
          for lib in libobs.so.30 libobs-frontend-api.so.30 onnxruntime.so.1.22 libopencv_core.so.410; do
            if echo "$NEEDED" | grep -qx "$lib"; then
              echo " ✅ $lib 在 DT_NEEDED 中"
            else
              echo " ⚠️ $lib 不在 DT_NEEDED（可能依赖方式不同）"
            fi
          done

          if ldd "$SO" 2>&1 | grep -q "not found"; then
            echo "❌ ldd 发现未命中的库（ABI 不兼容）："
            ldd "$SO" 2>&1 | grep "not found"
            exit 1
          fi
          echo "✅ ldd 全部命中（ABI 与 Fedora 44 兼容）"
          echo
          echo "🎉 全部通过——编译产物 ABI 与 Fedora 44 匹配"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-backgroundremoval-fedora44-x86_64
          path: obs-backgroundremoval-fedora44-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
