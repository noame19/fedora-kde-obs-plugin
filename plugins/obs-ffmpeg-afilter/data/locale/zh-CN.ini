Tip_mix=干湿混合。\n0=全干；1=全湿
Tip_m=混合简写。
Tip_room=房间大小。\n混响的房间感。常见：0-1
Tip_room_size=房间大小。
Tip_damping=阻尼。\n高频衰减速度。常见：0-1

; --- 调制效果 ---
Tip_speed=调制速度(Hz)。\n颤音/震音的快慢。常见：0.1-10
Tip_depth=调制深度。\n0=无效果；1=最大效果
Tip_phase=相位。\n0-360 度
Tip_amount=效果强度。\n常见：0-1
Tip_intensity=强度。\n常见：0-1
Tip_strength=强度。\n常见：0-1
Tip_magnitude=幅度。\n常见：0-1
