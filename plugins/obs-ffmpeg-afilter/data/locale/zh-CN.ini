; ===========================================================================
; obs-ffmpeg-afilter 简体中文翻译
; ===========================================================================
;
; 命名规则：
;   - 模块级信息（3 项）：Description / FilterName / Filter
;   - 声道布局（7 项）：ChLayout_<NAME>
;   - 滤镜下拉项（Filter_<ffmpeg-name>）：
;       直播常用：*中文名 - 实际用途（典型使用场景）
;       其他：  中文名 - 实际用途（典型使用场景）
;   - 滤镜参数（Param_<ffmpeg-opt-name>）：单个中文词
;
; 滤镜分组（A-L，12 组共 142 个，已排除 12 个黑名单）：
;   A. 音量 / 增益    B. 压缩 / 门限 / 压扩
;   C. 均衡 / 滤波    D. 降噪 / 修复
;   E. 立体声 / 空间  F. 调制 / 颤音
;   G. 延迟 / 回声 / 混响  H. 失真 / 增强
;   I. 混音 / 路由    J. 格式 / 元数据 / 处理
;   K. 信号源 / 测试  L. 杂项工具
;
; 修改流程：
;   1. 改这个文件（zh-CN.ini）
;   2. git commit
;   3. GitHub Actions 云编译会自动把这个 ini 装到
;      ~/.config/obs-studio/plugins/obs-ffmpeg-afilter/data/locale/zh-CN.ini
;   4. OBS 语言切到中文（或简中）即生效

; ===== 模块级信息 =====
Filter=滤镜
Description="FFMPEG 音频滤镜（FFmpeg 全部音频滤镜）"
FilterName="FFMPEG 音频滤镜"

; ===== 声道布局（下拉项的显示文本，值传给 ffmpeg） =====
ChLayout_Mono=单声道
ChLayout_Stereo=立体声
ChLayout_2POINT1="2.1 声道"
ChLayout_4POINT0="4.0 声道"
ChLayout_4POINT1="4.1 声道"
ChLayout_5POINT1="5.1 声道"
ChLayout_7POINT1="7.1 声道"

; ----- A. 音量 / 增益（7 个） -----
Filter_volume="*A音量 - 实时调音量大小（推流时手动调大小声）"
