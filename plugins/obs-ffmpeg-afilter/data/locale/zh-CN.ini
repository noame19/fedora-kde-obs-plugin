; ===== 参数悬浮提示（tooltip）=====
; 格式：Tip_<ffmpeg 参数名> = 参数作用\\n常见值：xxx
; 用 \\n 表示 OBS UI tooltip 中的换行（obs_module_text 会原样保留）
; 没翻译的回退到 ffmpeg 英文 help（如 "set volume"），不影响使用

; --- 音量 / 增益 ---
Tip_volume="音量调节表达式。\n常见值：1.0=原音量；2.0=放大2倍；0.5=减半；可以写表达式如 0.5+sin(t)"
Tip_precision=数学运算精度。\n常见：float=单精度（快）；double=双精度（精）；fixed=定点
Tip_eval=表达式求值时机。\n常见：once=一次（快）；frame=每帧（动态）
Tip_replaygain="ReplayGain 处理。\n常见：drop=丢弃；track=应用轨道增益；album=应用专辑增益"
Tip_replaygain_preamp="ReplayGain 前置放大(dB)。\n常见：-3 到 +6；防止音量跳变"
Tip_replaygain_noclip="ReplayGain 防爆音。\ntrue=开启防爆音（推荐）"
Tip_level="电平/音量值。\n常见：0 到 1"
Tip_level_in=输入增益倍率。\n1=不增益；2=放大2倍；0.5=减半
Tip_level_out=输出增益倍率。\n1=不增益
Tip_gain="增益(dB)。\n正值放大，负值衰减。常见：-20 到 +20"
Tip_gain_entry=增益表条目
Tip_g="增益(dB) 简写。\n同 gain"
Tip_in_gain=输入增益(dB)。\n常见：0=不变
Tip_out_gain=输出增益(dB)。\n常见：0=不变
Tip_balance=左右声道平衡。\n-1=全左；0=居中；+1=全右

; --- 频率 ---
Tip_frequency=中心/截止频率(Hz)。\n常见：100=低频；1000=中频；5000=中高频；10000=高频
Tip_freq="频率(Hz) 简写。"
Tip_f="频率(Hz) 简写。"
Tip_center=中心频率(Hz)。
Tip_poles=滤波器极点数。\n1=单极（一阶）；2=双极（二阶，更陡）
Tip_p="极点数 简写。"

; --- 滤波参数 ---
Tip_width="带宽/宽度。\n单位由 width_type 决定。常见：0.5-5"
Tip_w=带宽简写。
Tip_width_type=带宽类型。\n常见：h=Hz；q=Q因子；o=倍频程；s=斜率；k=Hz斜率
Tip_normalize=归一化系数。\ntrue=让滤波器保持整体响度（推荐）
Tip_n="归一化 简写。"
Tip_transform="变换类型。\nDI/DII/DIT/DIIT 等离散变换实现"
Tip_blocksize="FFT 块大小。\n0=自动；1024=精细；8192=粗略"
Tip_b="块大小 简写。"
Tip_ripples=通带纹波(dB)。\n越小越平坦。常见：0.01
Tip_rip="纹波 简写。"
Tip_order=滤波器阶数。\n越高越陡，但延迟越大
Tip_ord="阶数 简写。"
Tip_taps="抽头数。\nFIR 滤波器系数数量。越大越精确"
Tip_decay=衰减/衰减时间。\n常见：0-1
Tip_clamp=钳制。\ntrue=把信号限制在范围内
Tip_expand=扩展。\n动态范围扩展策略
