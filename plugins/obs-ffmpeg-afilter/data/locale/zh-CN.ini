Tip_channel=声道选择。\nFL/FR/FC/LFE/BL/BR/SL/SR 等
Tip_channels=作用声道。\n默认 "all"；可指定如 "FL|FR"
Tip_c=声道简写。
Tip_ch_layout=声道布局。\nstereo/5.1/7.1 等
Tip_channel_layout=声道布局。
Tip_ch_layouts=多声道布局。
Tip_layout=布局。
Tip_ch_count=声道数。
Tip_nb_channels=声道数。
Tip_pan_width=声相宽度。\n立体声宽度调节。常见：0-1

; --- 时间 / 采样 ---
Tip_start=开始时间(秒)。
Tip_end=结束时间(秒)。
Tip_start_pts=开始时间戳。
Tip_end_pts=结束时间戳。
Tip_start_sample=开始采样点。
Tip_end_sample=结束采样点。
Tip_samples=采样数。
Tip_nb_samples=采样数。
Tip_pts=显示时间戳(PTS)。
Tip_size=大小/尺寸。
Tip_length=长度(秒)。
Tip_duration=持续时长(秒)。
Tip_buf_size=缓冲区大小。\n越大延迟越大但更稳定
Tip_overlap=重叠量。\nFFT 帧重叠。常见：0.5-0.75
Tip_hop_size=步长/跳跃大小。
Tip_block_size=块大小。

