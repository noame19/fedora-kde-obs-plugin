Param_rotation=旋转角
Tip_rotation=水平方向旋转角度(度)。\n常见值：0=正前方；-90=左；90=右；180=背后
Param_elevation=俯仰角
Tip_elevation=垂直方向角度(度)。\n常见值：0=水平；-90=正下；90=正上
Param_radius=半径
Tip_radius=听者到音箱的半径距离(米)。\n常见值：1-3；越大声场越远
Param_anglestep=角度步长
Tip_anglestep=邻域搜索的角度步长(度)。\n常见值：0.5；越小越精细
Param_radstep=半径步长
Tip_radstep=邻域搜索的半径步长。\n常见值：0.01
Param_framesize=帧大小
Tip_framesize=每帧样本数。\n常见值：1024、2048
Param_lfegain="LFE 增益"
Tip_lfegain="LFE 低频效果声道增益(dB)。\n常见值：0-10"
Param_minphase=最小相位
Tip_minphase=最小相位响应开关。\ntrue=更短延迟；false=线性相位（推荐）
Param_interpolate=插值
Tip_interpolate=邻域插值开关。\ntrue=更平滑；false=更快
Param_speakers=音箱
Tip_speakers=自定义音箱位置\n格式：FL.x|FL.y|FR.x|FR.y|...
