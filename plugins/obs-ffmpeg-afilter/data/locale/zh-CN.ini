; ===========================================================================
; obs-ffmpeg-afilter 简体中文翻译
; ===========================================================================
;
; 命名规则：
;   - 模块级信息（3 项）：Description / FilterName / Filter
;   - 声道布局（7 项）：ChLayout_<NAME>
;   - 滤镜下拉项（Filter_<ffmpeg-name>）："中文名 - 效果说明" 格式
;   - 滤镜参数（Param_<ffmpeg-opt-name>）：单个中文词
;
; 修改流程：
;   1. 改这个文件（zh-CN.ini）
;   2. git commit
;   3. GitHub Actions 云编译会自动把这个 ini 装到
;      ~/.config/obs-studio/plugins/obs-ffmpeg-afilter/data/locale/zh-CN.ini
;   4. OBS 语言切到中文（或简中）即生效

; ===== 模块级信息 =====
Filter=滤镜
Description=FFMPEG 音频滤镜（FFmpeg 全部音频滤镜）
FilterName=FFMPEG 音频滤镜

; ===== 声道布局（下拉项的显示文本，值传给 ffmpeg） =====
ChLayout_Mono=单声道
ChLayout_Stereo=立体声
ChLayout_2POINT1=2.1 声道
ChLayout_4POINT0=4.0 声道
ChLayout_4POINT1=4.1 声道
ChLayout_5POINT1=5.1 声道
ChLayout_7POINT1=7.1 声道

; ===== 滤镜下拉项（"中文名 - 效果说明"） =====
; 格式：Filter_<ffmpeg 内置滤镜名> = 中文名 - 5-10 字效果说明
; 这些是 ffmpeg 8.x 自带的全部音频滤镜（已排除 12 个黑名单）：
;   abench, afade, afifo, aloop, ametadata, aperms, areverse, anull,
;   replaygain, silencedetect, silenceremove, volumedetect

; --- 音量 / 增益 ---
Filter_volume=音量 - 调节音量大小
Filter_amultiply=信号乘法 - 多通道信号相乘
Filter_loudnorm=响度归一 - EBU R128 响度归一
Filter_dynaudnorm=动态归一 - 动态响度归一化
Filter_speechnorm=对话归一 - 对话音量自动归一

; --- 动态 / 压缩 / 限制 ---
Filter_acompressor=压缩器 - 动态范围压缩
Filter_agate=噪声门 - 静音自动抑制
Filter_sidechaingate=侧链门 - 侧链触发噪声门
Filter_sidechaincompress=侧链压缩 - 侧链触发压缩
Filter_alimiter=限幅器 - 限制峰值电平
Filter_compand=压扩器 - 双向压扩处理
Filter_mcompand=多段压扩 - 多频段压扩
Filter_contrast=对比增强 - 声音对比增强
Filter_adrc=动态范围控制 - 自适应动态范围
Filter_adynamicsmooth=动态平滑 - 动态平滑处理

; --- 均衡 / 滤波 ---
Filter_equalizer=均衡器 - 多段参数均衡
Filter_superequalizer=超级均衡 - 10 段图示均衡
Filter_firequalizer=FIR 均衡 - 任意响应均衡
Filter_anequalizer=N 段均衡 - 多段参量均衡
Filter_bass=低音 - 提升或衰减低频
Filter_treble=高音 - 提升或衰减高频
Filter_lowpass=低通滤波 - 滤除高频成分
Filter_highpass=高通滤波 - 滤除低频成分
Filter_bandpass=带通滤波 - 保留某段频率
Filter_bandreject=带阻滤波 - 去除某段频率
Filter_biquad=双二阶 - 双二阶滤波
Filter_allpass=全通滤波 - 相位调整滤波
Filter_lowshelf=低架滤波 - 低频增益调节
Filter_highshelf=高架滤波 - 高频增益调节
Filter_aiir=IIR 滤波 - 无限冲击响应
Filter_afir=FIR 滤波 - 有限冲击响应
Filter_asubboost=低频增强 - 超低频段增强
Filter_asubcut=低频切除 - 切除低频噪音
Filter_afftfilt=FFT 滤波 - 频域滤波
Filter_afftfilter=FFT 滤波 - 频域滤波（新）
Filter_afreqshift=频率偏移 - 全频带频率偏移
Filter_asoftclip=软削波 - 软限幅削波
Filter_asubcut=低频切除 - 切除低频成分

; --- 立体声 / 空间 ---
Filter_extrastereo=立体声扩展 - 增强立体声宽度
Filter_stereowiden=立体声加宽 - 立体声加宽处理
Filter_stereotools=立体声工具 - 立体声处理工具
Filter_earwax=耳垢效果 - 声道重映射
Filter_haas=哈斯效应 - 立体声延迟效果
Filter_headphone=耳机虚拟 - 耳机环绕效果
Filter_surround=环绕声 - 多声道环绕编码
Filter_crossfeed=交叉馈送 - 耳机交叉馈送
Filter_pan=声相调整 - 左右声道平衡
Filter_channelmap=声道映射 - 声道重映射
Filter_channelsplit=声道分离 - 拆分多声道
Filter_aspatial=空间定位 - 空间声定位

; --- 调制 / 颤音 ---
Filter_chorus=合唱效果 - 多重延迟叠加
Filter_flanger=镶边效果 - 梳状滤波镶边
Filter_aphaser=相位器 - 相位移动效果
Filter_aphaseshift=相位偏移 - 简单相位偏移
Filter_apulsator=脉冲调制 - 左右声道脉冲切换
Filter_tremolo=颤音 - 音量周期性变化
Filter_vibrato=抖音 - 音高周期性变化

; --- 延迟 / 回声 / 混响 ---
Filter_aecho=回声效果 - 多重回声叠加
Filter_adelay=延迟器 - 多通道延迟
Filter_reverb=混响效果 - 室内混响

; --- 失真 / 增强 ---
Filter_acrusher=失真器 - 比特破碎失真
Filter_aexciter=激励器 - 谐波激励增强
Filter_crystalizer=谐波增强 - 增强高频谐波
Filter_aemphasis=预加重 - 录音预加重

; --- 降噪 / 修复 ---
Filter_adeclick=去爆音 - 移除数字爆音
Filter_adeclip=去削波 - 修复削波失真
Filter_deesser=去齿音 - 移除齿音刺耳
Filter_dialoguenhance=对话增强 - 突出人声对白
Filter_adialoguenhance=对话增强 - 增强人声对白
Filter_anlmdn=非局部降噪 - 高级非局部均值降噪
Filter_anlms=自适应滤波 - 自适应 LMS 滤波
Filter_adenorm=直流修复 - DC 偏移修复

; --- 混音 / 拼接 ---
Filter_amix=混音器 - 多输入流混音
Filter_amerge=流合并 - 合并多音频流
Filter_ainterleave=交错混合 - 多流交错混合
Filter_asplit=流分割 - 拆分多输出流

; --- 静音 / 填充 ---
Filter_apad=静音填充 - 静音段自动填充

; --- 变速 / 变调 ---
Filter_atempo=变速 - 改变播放速度

; --- 格式 / 转换 ---
Filter_aformat=格式转换 - 音频格式转换
Filter_aresample=重采样 - 采样率转换

; --- 信号源 ---
Filter_asine=正弦波 - 正弦波生成
Filter_anullsrc=静音源 - 静音源生成
Filter_flite=语音合成 - 语音合成

; --- 检测 / 测量 ---
Filter_astats=音频统计 - 音频统计分析
Filter_ebur128=响度测量 - EBU R128 标准测量
Filter_aphasemeter=相位表 - 相位相关性测量
Filter_ahistogram=直方图 - 频率直方图显示

; --- 选择 / 命令 ---
Filter_aselect=流选择 - 选择音频流
Filter_asendcmd=命令发送 - 发送命令
Filter_asetnsamples=设采样数 - 设置每段采样数
Filter_asetpts=设时间戳 - 设置 PTS 时间戳
Filter_asetrate=设采样率 - 设置音频采样率

; --- 其他 ---
Filter_acopy=直通复制 - 音频信号直通复制
Filter_acrossover=分频器 - 多分频段分频
Filter_acue=切片点 - 切片提示点
Filter_acenterbar=中央条 - 中央显示条
Filter_afilter=占位滤镜 - 内部占位滤镜
Filter_afirsrc=FIR 源 - FIR 滤波器源
Filter_aintegral=积分器 - 信号积分
Filter_alatency=延迟补偿 - 延迟对齐补偿
Filter_asdr=SDR 转换 - SDR 动态范围
Filter_ashowinfo=显示信息 - 显示音频信息
Filter_compensationdelay=补偿延迟 - 同步延迟补偿
Filter_dcshift=直流偏移 - 调整 DC 偏移
Filter_feedback=反馈 - 反馈处理
Filter_hdcd=HDCD 解码 - HDCD 高清音频解码
Filter_ladspa=LADSPA - 加载 LADSPA 插件
Filter_lv2=LV2 - 加载 LV2 插件

